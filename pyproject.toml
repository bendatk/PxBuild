[tool.poetry]
name = "pxbuild"
version = "0.1.2"
description = "Tool for building px-files"
authors = ["Team Nettop"]
license = "Apache 2.0"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10.12"
pyarrow = ">=14.0.1"
pandas = ">=1.5.3"
pydantic = ">=1.10.6"
pre-commit = ">=4.0.1"
jinja2 = ">=3.1.2"
pytz = ">=2022.7"
numpy = ">=1.23.5"

[tool.poetry.group.dev.dependencies]
ipykernel = "6.25.0"
pytest = ">=8.3.3"
coverage = {extras = ["toml"], version = "^7.6.7"}
pytest-cov = ">=6.0.0"
flake8 = ">=7.1.1"
flake8-bugbear = ">=24.10.31"
pep8-naming = ">=0.14.1"
black = "22.6.0"
datamodel-code-generator = "^0.30.1"
pyspark = "^3.5.5"
databricks-connect = "15.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
