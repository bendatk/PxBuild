[project]
name = "pxbuild"
version = "0.2.4"
description = "Tool for building px-files"
authors = [{ name = "Team Nettop" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10.12"
dependencies = [
    "pyarrow>=14.0.1",
    "pandas>=1.5.3",
    "pydantic>=1.10.6",
    #"pytz>=2022.7",
    "numpy>=1.23.5",
]

[project.optional-dependencies]
spark = ["pyspark>=3.5.0"]

[dependency-groups]
dev = [
    "pre-commit>=4.0.1",
    "ipykernel==6.25.0",
    "pytest>=8.3.3",
    "coverage[toml]>=7.6.7",
    "pytest-cov>=6.0.0",
    "flake8>=7.1.1",
    "flake8-bugbear>=24.10.31",
    "pep8-naming>=0.14.1",
    "black==22.6.0",
    "datamodel-code-generator>=0.30.1",
    "databricks-connect==15.4.0",
    "jinja2>=3.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pxbuild"]

[tool.black]
line-length = 120
